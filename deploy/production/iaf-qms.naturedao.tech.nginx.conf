server {
    listen 80;
    server_name iaf-qms.naturedao.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name iaf-qms.naturedao.tech;

    ssl_certificate /etc/letsencrypt/live/iaf-qms.naturedao.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iaf-qms.naturedao.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 100m;
    access_log /var/log/nginx/iaf-qms_access.log;
    error_log /var/log/nginx/iaf-qms_error.log;

    location / {
        proxy_pass http://127.0.0.1:15174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }
}

