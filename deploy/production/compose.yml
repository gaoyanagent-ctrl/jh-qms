name: jh-qms

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ${JH_QMS_DB_NAME:-jh_qms}
      POSTGRES_USER: ${JH_QMS_DB_USER:-jh_qms}
      POSTGRES_PASSWORD: ${JH_QMS_DB_PASSWORD:?JH_QMS_DB_PASSWORD is required}
    volumes:
      # PostgreSQL 18 stores data below a major-version-specific directory.
      # Mount the parent so future pg_upgrade operations do not cross a mount boundary.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JH_QMS_DB_USER:-jh_qms} -d ${JH_QMS_DB_NAME:-jh_qms}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [jh-qms-internal]

  backend:
    build:
      context: ../..
      dockerfile: deploy/production/backend.Dockerfile
    environment:
      BACKEND_PORT: 8080
      IAF_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${JH_QMS_DB_NAME:-jh_qms}
      IAF_DATASOURCE_USERNAME: ${JH_QMS_DB_USER:-jh_qms}
      IAF_DATASOURCE_PASSWORD: ${JH_QMS_DB_PASSWORD:?JH_QMS_DB_PASSWORD is required}
      IAF_AUTH_TOKEN_STORE: memory
      QMS_STORAGE_ENDPOINT: http://minio:9000
      QMS_STORAGE_ACCESS_KEY: ${JH_QMS_MINIO_ACCESS_KEY:-jh-qms}
      QMS_STORAGE_SECRET_KEY: ${JH_QMS_MINIO_SECRET_KEY:?JH_QMS_MINIO_SECRET_KEY is required}
      QMS_STORAGE_BUCKET: ${JH_QMS_MINIO_BUCKET:-jh-qms-files}
      QMS_PARSER_BASE_URL: http://ai-service:8000
      QMS_PARSER_WORKER_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${JH_QMS_BACKEND_PORT:-18082}:8080"
    restart: unless-stopped
    networks: [jh-qms-internal]

  ai-service:
    build:
      context: ../..
      dockerfile: deploy/production/ai-service.Dockerfile
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [jh-qms-internal]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${JH_QMS_MINIO_ACCESS_KEY:-jh-qms}
      MINIO_ROOT_PASSWORD: ${JH_QMS_MINIO_SECRET_KEY:?JH_QMS_MINIO_SECRET_KEY is required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [jh-qms-internal]

  frontend:
    build:
      context: ../..
      dockerfile: deploy/production/frontend.Dockerfile
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${JH_QMS_FRONTEND_PORT:-15174}:80"
    restart: unless-stopped
    networks: [jh-qms-internal]

networks:
  jh-qms-internal:
    driver: bridge

volumes:
  postgres-data:
  minio-data:
