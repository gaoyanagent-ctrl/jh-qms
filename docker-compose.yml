services:
  postgres:
    image: postgres:18
    container_name: iaf-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-iaf}
      POSTGRES_USER: ${POSTGRES_USER:-iaf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iaf}
    ports:
      # ADR-0002: PostgreSQL 16 -> 18. Host port 5432 is occupied by another
      # project container, so the IAF stack is bound to 5123 by default.
      - "${POSTGRES_PORT:-5123}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iaf} -d ${POSTGRES_DB:-iaf}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: iaf-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: iaf-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-iafadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-iafadmin123}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  redis-data:
  minio-data:
